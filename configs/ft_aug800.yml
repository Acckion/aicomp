__include__:
- ./rgb1600.yml
output_dir: /home/fbohan/AIC/runs/ft_aug800
epochs: 20
warmup_epochs: 1
min_lr_factor: 0.1
eval_spatial_size:
- 800
- 800
optimizer:
  lr: 5.0e-05
  params:
  - params: ^(?=.*backbone)(?!.*norm|bn).*$
    lr: 5.0e-07
  - params: ^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$
    weight_decay: 0.0
ema:
  decay: 0.999
  warmups: 1000
train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      policy:
        epoch: 999
      ops:
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 800
        - 800
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
  collate_fn:
    base_size: 800
    base_size_repeat: 3
    stop_epoch: 999
val_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      ops:
      - type: Resize
        size:
        - 800
        - 800
      - type: ConvertPILImage
        dtype: float32
        scale: true
