__include__:
- /home/fbohan/AIC/experiments/model_sources/DEIMv2/configs/deimv2/deimv2_dinov3_x_coco.yml
num_classes: 12
remap_mscoco_category: false
epoches: 24
output_dir: /home/fbohan/AIC/runs/deimv2_x
device: cuda
sync_bn: false
find_unused_parameters: true
use_amp: true
use_ema: true
tuning: /home/fbohan/AIC/checkpoints/deimv2/X_model.safetensors
DINOv3STAs:
  weights_path: null
gradient_accumulation_steps: 3
PostProcessor:
  num_top_queries: 100
lr_scheduler: null
lr_warmup_scheduler: null
ema:
  decay: 0.999
  warmups: 1000
optimizer:
  lr: 0.00015
  params:
  - params: ^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$
    lr: 5.0e-06
  - params: ^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$
    lr: 5.0e-06
    weight_decay: 0
  - params: ^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0
train_dataloader:
  total_batch_size: 4
  num_workers: 4
  dataset:
    img_folder: /home/fbohan/AIC/data/train
    ann_file: /home/fbohan/AIC/data/annotations/train1600.json
    transforms:
      ops:
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch: 20
        ops:
        - Mosaic
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
  collate_fn:
    base_size: 640
    base_size_repeat: 3
    stop_epoch: 20
    mixup_prob: 0
    copyblend_prob: 0
val_dataloader:
  total_batch_size: 4
  num_workers: 3
  dataset:
    img_folder: /home/fbohan/AIC/data/train
    ann_file: /home/fbohan/AIC/data/annotations/val400.json
DEIMCriterion:
  matcher:
    matcher_change_epoch: 18
gpu_memory_limit_gib: 8.0
