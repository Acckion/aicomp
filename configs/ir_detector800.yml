__include__: ['./mechanism_base800.yml']
output_dir: /home/fbohan/AIC/runs/ir_detector800
mechanism_imports: [extra_iou_metrics, zip_ir_dataset]
epochs: 24
warmup_epochs: 1
freeze_bn_statistics: false
sync_bn: true
gradient_accumulation_steps: 3
smoke_empty_rank: 1
smoke_steps: 6
checkpoint_freq: 24
save_epoch_training_states: false
inference_checkpoint_interval: 3
HGNetv2:
  freeze_at: -1
  freeze_norm: false
optimizer:
  lr: 0.0001
  params:
    - params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.00001
    - params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.00001
      weight_decay: 0.0
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.0
train_dataloader:
  total_batch_size: 4
  num_workers: 2
  dataset:
    type: ZipIRCocoDetection
    archive: /home/fbohan/AIC/初赛数据集-面向城市场景的多模态目标检测/训练集/AIC2026_Train_2000.zip
    transforms:
      ops:
        - type: RandomPhotometricDistort
          p: 0.2
        - type: RandomZoomOut
          fill: 0
        - type: RandomIoUCrop
          p: 0.8
        - type: SanitizeBoundingBoxes
          min_size: 1
        - type: RandomHorizontalFlip
        - type: Resize
          size: [800, 800]
        - type: SanitizeBoundingBoxes
          min_size: 1
        - type: ConvertPILImage
          dtype: float32
          scale: true
        - type: ConvertBoxes
          fmt: cxcywh
          normalize: true
val_dataloader:
  total_batch_size: 4
  num_workers: 2
  dataset:
    type: ZipIRCocoDetection
    archive: /home/fbohan/AIC/初赛数据集-面向城市场景的多模态目标检测/训练集/AIC2026_Train_2000.zip
