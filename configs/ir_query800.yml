__include__: ['./mechanism_base800.yml']
model: IRAlignedDFINE
output_dir: /home/fbohan/AIC/runs/ir_query800
mechanism_imports: [extra_iou_metrics, ir_query_alignment]
IRAlignedDFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  ir_enabled: true
epochs: 8
warmup_epochs: 1
gradient_accumulation_steps: 4
checkpoint_freq: 8
inference_checkpoint_interval: 2
optimizer:
  lr: 0.00001
  params:
    - params: '^ir_query\.'
      lr: 0.0003
    - params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.000001
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.0
train_dataloader:
  total_batch_size: 2
  num_workers: 2
  dataset:
    type: PairedIRCoco
    archive: /home/fbohan/AIC/初赛数据集-面向城市场景的多模态目标检测/训练集/AIC2026_Train_2000.zip
    training: true
    size: 800
    transforms: null
val_dataloader:
  total_batch_size: 2
  num_workers: 2
  dataset:
    type: PairedIRCoco
    archive: /home/fbohan/AIC/初赛数据集-面向城市场景的多模态目标检测/训练集/AIC2026_Train_2000.zip
    training: false
    size: 800
    transforms: null
