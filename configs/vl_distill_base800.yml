__include__: ['./mechanism_base800.yml']
model: VLDFINE
criterion: VLDFINECriterion
mechanism_imports: [extra_iou_metrics, vl_distillation]
epochs: 8
smoke_steps: 6
smoke_empty_rank: 0
checkpoint_freq: 8
save_epoch_training_states: false
inference_checkpoint_interval: 1
VLDFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  feature_dim: 768
VLDFINECriterion:
  teacher_cache: /home/fbohan/AIC/experiments/vl_distillation/teacher
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: [vfl, boxes, local]
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  feature_weight: 0.1
  semantic_weight: 0.02
  ramp_epochs: 2
  temperature: 0.1
optimizer:
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 1.0e-07
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.0
    - params: '^vl_projector.*$'
      lr: 0.0001
train_dataloader:
  total_batch_size: 3
  dataset:
    type: VLTrainCoco
    teacher_cache: /home/fbohan/AIC/experiments/vl_distillation/teacher
    transforms:
      ops:
        - type: RandomPhotometricDistort
          p: 0.5
        - type: VLSanitizeBoxes
          min_size: 1
        - type: RandomHorizontalFlip
        - type: Resize
          size: [800, 800]
        - type: VLSanitizeBoxes
          min_size: 1
        - type: ConvertPILImage
          dtype: float32
          scale: true
        - type: ConvertBoxes
          fmt: cxcywh
          normalize: true
