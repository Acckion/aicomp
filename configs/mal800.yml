__include__: ['./mechanism_base800.yml']
mechanism_imports: [mal_dfine_criterion, extra_iou_metrics]
criterion: MALDFINECriterion
output_dir: /home/fbohan/AIC/runs/mal800
MALDFINECriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 1.5
  mal_alpha: null
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
